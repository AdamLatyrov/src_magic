    max_images_per_request: 10
    frames_per_request: 10
    temperature: 0.001
    top_p: 0.1
    max_tokens: 8192
  - check_key: manual_effort
    name: Лишний ручной ввод и повторы
    units:
    - Р1
    - Р2
    - Р3
    - Р4
    - Р5
    - Р6
    prompts_dir: prompts/journey_frictions/manual_effort/
    max_images_per_request: 10
    frames_per_request: 10
    temperature: 0.001
    top_p: 0.1
    max_tokens: 8192
  - check_key: blockers
    name: Тупики, ошибки и обрывы маршрута
