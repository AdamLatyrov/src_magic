  min_frames_per_request: 4
  max_len: 300
  temperature: 0.001
  top_p: 0.1
  max_tokens: 8192
journey_frictions:
  checks:
  - check_key: route_length
    name: Маршрут длиннее, чем должен быть
    units:
    - Р1
    - Р2
    - Р3
    - Р4
    - Р5
    - Р6
