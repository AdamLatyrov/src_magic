    max_images_per_request: 10
    frames_per_request: 10
    temperature: 0.001
    top_p: 0.1
    max_tokens: 8192
  - check_key: navigation_clarity
    name: Непонятно, где клиент и что дальше
    units:
    - Н1
    - Н2
    - Н3
    - Н4
    - Н5
    - Н6
    - Н7
    - Н8
    prompts_dir: prompts/journey_frictions/navigation_clarity/
    max_images_per_request: 10
    frames_per_request: 10
    temperature: 0.001
    top_p: 0.1
    max_tokens: 8192
  - check_key: trust
    name: Обещанное расходится с делающимся
    units:
    - Р1
    - Р2
    - Р3
    - Р4
    - Р5
    prompts_dir: prompts/journey_frictions/trust/
    max_images_per_request: 10
    frames_per_request: 10
    temperature: 0.001
    top_p: 0.1
    max_tokens: 8192
