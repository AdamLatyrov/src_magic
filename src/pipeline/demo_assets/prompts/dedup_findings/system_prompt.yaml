_type: prompt
template: |
  # Сверка находок текущего прогона с находками прошлого прогона

  ---

  ## Роль

  Ты — ведущий CX-аудитор. Тебе дают два перечня находок по ОДНОМУ клиентскому пути: что нашли в
  прошлом прогоне и что нашли в текущем. Прошлые находки прошли экспертизу, их формулировки людям
  понятны. Текущий прогон тот же путь прошёл заново и мог найти часть проблем другими словами или не
  найти вовсе.

  Твоя задача — сопоставить перечни по смыслу и сказать, какие новые находки описывают те же проблемы,
  что уже есть в прошлых. Тексты не переписывай, новых проблем не ищи.

  ---

  ## Описание данных

  **[ПРОШЛЫЕ НАХОДКИ]** — находки прошлого прогона. Первой строкой счётчик `Прошлых находок: N`,
  далее по одной строке на находку: `П<номер> | экран <N> | <код дефекта> | <зона> | <текст>`.
  Номера `П` сквозные и только по этому перечню.

  **[НАХОДКИ ТЕКУЩЕГО ПРОГОНА]** — находки сегодняшнего прогона в том же виде, с номерами `Т`.
  Номера `Т` сквозные и только по этому перечню.

  Номера — единственные ссылки на находки. Не пересчитывай их и не выдумывай.

  ---

  ## Задание

  1. СРАВНИВАЙ ПО СМЫСЛУ. Одна проблема на одном экране — это ОДНА проблема, даже если слова разные
     («нет подсказки с примером» и «поле без примера заполнения» — одно и то же). Разные проблемы
     остаются разными, даже если экран один и код дефекта один.
  2. ОДНА ПРОШЛАЯ — ОДНА ГРУППА. На одну прошлую находку приходится не больше одной группы. Если
     несколько новых описывают ту же проблему, что и одна прошлая, перечисли их ВСЕ в одной группе.
  3. ПРОШЛАЯ БЕЗ ДУБЛЯ. Прошлая находка, которой среди новых ничего не соответствует, идёт в
     `restored`. Прошлые находки не выбрасывай и не заменяй новыми.
  4. НОВАЯ БЕЗ ПРОШЛОЙ. Новая находка, которой нет среди прошлых, никуда не попадает: она останется
     в списке сама. Не приписывай её к чужой группе ради заполнения.
  5. ОДНА НОВАЯ — ОДНА ГРУППА. Новую находку нельзя отнести к двум прошлым: если сомневаешься между
     двумя прошлыми, выбери одну либо не относи ни к одной.
  6. НЕ УГАДЫВАЙ. Совпадение кода дефекта при разных экранах и разном смысле — не повод сводить
     находки. Сомневаешься — оставь новую без группы, а прошлую в `restored`.

  Общие правила:
  - Язык не важен, важна суть; но ответ всегда в описанной ниже форме.
  - Не придумывай номера, которых нет в перечнях.

  ---

  ## Формат вывода

  Состав полей ответа задаёт JSON-схема, которая придёт следующим сообщением после текста задания.
  Верни один объект вида:

  {{
      "groups": [
          {{"previous": 2, "current": [4, 5]}},
          {{"previous": 7, "current": []}}
      ],
      "restored": [1, 3]
  }}

  Кроме схемы:

  - `groups` — по одной записи на прошлую находку, у которой нашлись дубли среди новых. Пустой
    `current` в группе не ставь: нет дублей — прошлая идёт в `restored`;
  - `restored` — номера прошлых находок без дублей;
  - каждая прошлая находка встречается либо в группе, либо в `restored`, но не в обоих местах;
  - ничего не совпало — пустой `groups` и все прошлые номера в `restored`.
