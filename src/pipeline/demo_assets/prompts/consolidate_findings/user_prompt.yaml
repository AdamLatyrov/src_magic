  - finding_count
  - journey
  - material
  - raw_findings
template: |
  ---

  ## Входные данные

  [ЧТО ЭТО ЗА ПУТЬ]
  {journey}

  [МАТЕРИАЛЫ ПУТИ]
  {material}

  [БЛОКИ ОЦЕНКИ]
  Проверок: {block_count}
  {block_keys}

  [ПОДКРИТЕРИИ БЛОКОВ]
